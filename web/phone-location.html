<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>AI 护照 · 手机定位</title>
<style>
:root{color-scheme:light;--paper:#f6f5ef;--ink:#172e24;--green:#205c3f;--muted:#56635a;--line:#d4d9cd;--tint:#e7edde;--error:#a12c23}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.shell{max-width:540px;margin:auto;padding:32px 24px max(32px,env(safe-area-inset-bottom))}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650;margin-bottom:36px}.brand svg{width:30px;height:30px}h1{font-size:30px;line-height:1.3;letter-spacing:-.025em;font-weight:650;margin:0 0 16px;text-wrap:balance}p{margin:0 0 24px}.help{color:var(--muted);font-size:14px}.status{font-size:14px;overflow-wrap:anywhere;margin:20px 0}.status:empty{display:none}.status[data-error=true]{color:var(--error)}button{width:100%;min-height:52px;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation;background:var(--green);color:#fff}button:hover{background:#16482f}button:disabled{opacity:.6;cursor:wait}.secondary{background:var(--tint);color:var(--ink);margin-top:12px}.secondary:hover{background:#d8e5cf}label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}input{width:100%;min-height:50px;background:#fffef9;color:var(--ink);border:1px solid #9ca99b;border-radius:12px;padding:12px 14px;font:inherit;caret-color:var(--green)}:focus-visible{outline:3px solid #438259;outline-offset:3px}::selection{background:#c5dec9;color:var(--ink)}.result{margin-top:28px;border-top:1px solid var(--line);padding-top:24px}.note{border-top:1px solid var(--line);padding-top:20px;margin-top:28px;color:var(--muted);font-size:13px}@media(min-width:760px){.shell{margin:40px auto;padding:32px 40px;background:#fbfaf5;border:1px solid var(--line);border-radius:20px}}
.result label{margin-top:24px}
</style>
</head>
<body><main class="shell">
<header class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="2" width="24" height="28" rx="3" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="13" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M9 13h14M16 6c-4 4-4 10 0 14 4-4 4-10 0-14ZM11 25h10" stroke="currentColor" stroke-width="1.5"/></svg>AI 护照 · 手机定位</header>
<h1>让手机帮你<br>找到所在城市。</h1>
<p class="help">点下方按钮，并允许浏览器访问手机位置。返回设置页后会匹配附近城市，请核对后保存。</p>
<button id="locate" type="button">获取当前位置</button>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="result" class="result" hidden aria-label="定位结果">
<p id="summary"></p>
<button id="send" type="button" hidden>把位置带回设置页</button>
<label for="code">备用定位结果</label><input id="code" type="text" readonly autocomplete="off">
<button id="copy" type="button" class="secondary">复制定位结果</button>
<p class="help" style="margin-top:16px">如果没有自动返回，请复制结果，切回设备设置页并粘贴。保存设置时，手机需连接设备热点。</p>
</section>
<p class="note">此页面不向服务器提交你的坐标，也不跟踪位置。只有你点击“带回”或复制后，位置才交给设备设置页；最后由你确认保存。</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const say=(text,error=false)=>{$('status').textContent=text;$('status').dataset.error=String(error)};
let position=null,generation=0;
const params=new URLSearchParams(window.location.hash.slice(1)),request=params.get('request')||'';
function returnOrigin(value){try{const url=new URL(value);if(url.origin!==value||url.protocol!=='http:')return '';return ['192.168.4.1','localhost','127.0.0.1'].includes(url.hostname)?url.origin:''}catch(e){return ''}}
const origin=returnOrigin(params.get('origin')||'');
function canReturn(){return !!(origin&&/^[a-f0-9]{32}$/.test(request)&&window.opener&&!window.opener.closed)}
function failure(code){return ({1:'未获得定位权限。请在浏览器或手机设置中允许位置访问后重试。',2:'暂时无法获取位置。请开启手机定位，或移到信号较好的位置后重试。',3:'定位等待超时，请重试。'})[code]||'定位未成功，请重试。'}
$('locate').onclick=()=>{if(!window.isSecureContext||!navigator.geolocation){say('请在系统 Safari 或 Chrome 中通过 HTTPS 打开此页，再使用手机定位。',true);return}position=null;$('result').hidden=true;const run=++generation;$('locate').disabled=true;say('正在获取位置，请允许浏览器访问手机位置…');const timer=setTimeout(()=>{if(run===generation){generation++;$('locate').disabled=false;say(failure(3),true)}},45000);const done=()=>{clearTimeout(timer);generation++;$('locate').disabled=false};navigator.geolocation.getCurrentPosition(p=>{if(run!==generation)return;done();const {latitude:lat,longitude:lon,accuracy}=p.coords;if(![lat,lon,accuracy].every(v=>typeof v==='number'&&Number.isFinite(v))||Math.abs(lat)>90||Math.abs(lon)>180||accuracy<0||accuracy>50000){say('定位结果不够可靠，请开启精确位置后重试。',true);return}position={lat,lon,accuracy};$('summary').textContent='已获取位置，精度约 '+Math.ceil(accuracy)+' 米。';$('code').value='PPOS:'+lat.toFixed(6)+','+lon.toFixed(6)+','+Math.ceil(accuracy);$('result').hidden=false;$('send').hidden=!canReturn();say('定位成功。请把位置带回设置页，核对城市后保存。')},e=>{if(run!==generation)return;done();say(failure(e.code),true)},{enableHighAccuracy:true,timeout:20000,maximumAge:60000})};
$('send').onclick=()=>{if(!position||!canReturn()){say('未找到原来的设置窗口，请复制定位结果，手动切回设备设置页。',true);return}window.opener.postMessage({type:'passport-position',request,...position},origin);say('已发送到设置页。请切回原来的窗口，核对城市后保存。')};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('code').value);say('已复制。请切回设备设置页，粘贴到“定位结果没有自动返回？”中。')}catch(e){$('code').focus();$('code').select();say('未能自动复制。请长按定位结果复制，然后切回设置页。',true)}};
</script>
</body>
</html>
